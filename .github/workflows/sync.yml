name: Daily Riot match collection

on:
  schedule:
    # 3:17 a.m. CST / 4:17 a.m. CDT. Scheduled execution can be delayed by GitHub.
    - cron: '17 9 * * *'
  workflow_dispatch:
    inputs:
      profile:
        description: 'Collection size: smoke for a short connection/load check'
        type: choice
        required: true
        default: smoke
        options:
          - smoke
          - daily

permissions:
  contents: read

concurrency:
  group: riot-match-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ingest.txt

      - name: Install collector dependencies
        run: python -m pip install -r requirements-ingest.txt

      - name: Test collection rules without credentials
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Collect and load new matches
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
          SYNC_PROFILE: ${{ inputs.profile || 'daily' }}
          PGSSLMODE: require
        run: python ingest/sync.py

      - name: Save aggregate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: riot-sync-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/raw/sync_${{ github.run_id }}_${{ github.run_attempt }}/sync_report.json
          if-no-files-found: warn
          retention-days: 14
