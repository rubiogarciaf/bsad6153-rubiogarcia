# Render: New > Blueprint, select this repository and the release branch.
# Keep the existing Supabase database; no new database is provisioned.
services:
  - type: web
    name: league-lens
    runtime: python
    plan: free
    region: ohio
    buildCommand: python -m pip install -r requirements.txt
    startCommand: python -m streamlit run app/streamlit_app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    healthCheckPath: /_stcore/health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.14"
      - key: APP_DATABASE_URL
        sync: false
